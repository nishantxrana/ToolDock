# Netlify config for ToolDock.
# The /ado/* proxy forwards Azure DevOps REST calls (Azure DevOps sends no CORS
# headers, so a same-origin proxy is required). The SPA fallback serves index.html.

[build]
  command = "npm run build"
  publish = "dist"

# Proxy Azure DevOps API through same origin. Must come before the SPA fallback.
[[redirects]]
  from = "/ado/*"
  to = "https://dev.azure.com/:splat"
  status = 200
  force = true

# Proxy Azure DevOps Release Management API (vsrm subdomain - used by release pipeline tools).
[[redirects]]
  from = "/vsrm/*"
  to = "https://vsrm.dev.azure.com/:splat"
  status = 200
  force = true

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. Keep the script hash in sync with the inline theme script
# in index.html (src/__tests__/securityHeaders.test.ts checks this).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Eg8/MlDL6kRg7QFH/lZo/EhFZ+6BCO2CGIqSOSEPuQs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), display-capture=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# Not available on Netlify:
#  - The /jira proxy (Jira to Boards migration). Netlify redirects can't target
#    a per-request host, so use Vercel, nginx or the dev server for that one.
#  - The method + path allow-list from middleware.ts (Vercel only). Netlify
#    forwards any method to Azure DevOps; the token's scopes still apply.
