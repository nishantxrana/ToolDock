<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111216" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Compare, export and import Azure DevOps variable groups, check App Service settings and map release pipelines. Runs in your browser; your token stays in memory."
    />
    <title>ToolDock: Azure DevOps variable group tools</title>
    <link rel="canonical" href="https://tooldock.nishantxrana.com/" />

    <!-- Link previews (Slack, Teams, LinkedIn, WhatsApp, X). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolDock" />
    <meta property="og:url" content="https://tooldock.nishantxrana.com/" />
    <meta property="og:title" content="ToolDock: Azure DevOps variables, compared and exported in seconds" />
    <meta
      property="og:description"
      content="Diff variable groups across environments, check them against App Service settings, and export to Excel. Runs in your browser."
    />
    <meta property="og:image" content="https://tooldock.nishantxrana.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ToolDock: Azure DevOps variables compared and exported in seconds, next to a table comparing app-dev and app-prod values"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolDock: Azure DevOps variables, compared and exported in seconds" />
    <meta
      name="twitter:description"
      content="Diff variable groups across environments, check them against App Service settings, and export to Excel. Runs in your browser."
    />
    <meta name="twitter:image" content="https://tooldock.nishantxrana.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="ToolDock: Azure DevOps variables compared and exported in seconds, next to a table comparing app-dev and app-prod values"
    />
    <script>
      // Set the theme class before first paint so there is no flash of the wrong theme.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('tooldock-theme');
        } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
